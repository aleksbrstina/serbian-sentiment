name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies (core + dev + CPU PyTorch + transformers for model tests)
        run: uv sync --python 3.11 --extra neural --extra transformer
      - name: Lint
        run: make lint
      - name: Test
        run: make test
