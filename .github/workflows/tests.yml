name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies (core + dev + CPU PyTorch for the BiLSTM tests)
        run: uv sync --python 3.11 --extra neural
      - name: Lint
        run: make lint
      - name: Test
        run: make test
