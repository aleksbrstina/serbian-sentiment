[project]
name = "serbian-sentiment"
version = "0.1.0"
description = "Sentiment classification of Serbian-language reviews: classical ML vs. BiLSTM vs. fine-tuned BERTić."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "regex>=2024.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "scikit-learn>=1.4",
    "optuna>=3.6",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "mlflow>=2.12",
]

[project.optional-dependencies]
# Heavy dependencies are opt-in so the core pipeline and CI stay fast.
neural = ["torch>=2.2"]
transformer = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.19",
    "evaluate>=0.4",
    "accelerate>=0.30",
]
app = ["gradio>=4.30"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "nbformat>=5.11.1",
    "nbclient>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ANN", "D"]
ignore = ["D100", "D104", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"notebooks/**" = ["D", "ANN", "E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Raised inside MLflow's SQLAlchemy store, not in project code.
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
]
markers = [
    "slow: tests that train models or need large dependencies",
]

# CPU-only PyTorch wheels for local development and CI (much smaller than CUDA builds).
# The Colab/Kaggle notebook installs with pip, which ignores this section and uses the GPU build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
